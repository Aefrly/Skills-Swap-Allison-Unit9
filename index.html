<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Swap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Link to my CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column">
    <header class="py-4 text-center text-white bg-success">
        <!-- page header -->
        <h1>Skill Swap</h1>
        <nav class="navigation bg-light border-bottom">
        <ul class="container-fluid row row-cols-4">
            <!-- navigation links to other pages -->
            <li class="col"><a class="nav-link text-center fw-semibold py-3" href="home">Home</a></li>
            <li class="col"><a class="nav-link text-center fw-semibold py-3" href="browse-skills">Browse Skills</a></li>
            <li class="col"><a class="nav-link text-center fw-semibold py-3" href="offer-skills">Offer Skills</a></li>
            <li class="col"><a class="nav-link text-center fw-semibold py-3" href="about">About</a></li>
        </ul>
        </nav>
    </header>
    <main class="container flex-grow-1 py-5">
        <section class="hero-section w-100 mb-5">
            <div class="hero-content card border-0 mx-auto">
                <div class="card-body text-center">
                    <!-- page header with description -->
                    <h2 class="card-title text-success">Welcome to Skill Swap</h2>
                    <p class="card-text mb-0">Connect with others to learn new skills and share your expertise.</p>
                </div>
            </div>
        </section>
        <div class="row g-3 mb-4">
            <div class="col-12 col-md-6">
                <section class="filter-section mb-4">
                    <div class="btn-group" role="group">
                        <!-- buttons to be used for filtering skills -->
                        <button type="button" class="btn btn-outline-success filter-btn" data-category="All">All</button>
                        <button type="button" class="btn btn-outline-success filter-btn" data-category="Programming">Programming</button>
                        <button type="button" class="btn btn-outline-success filter-btn" data-category="Math">Math</button>
                        <button type="button" class="btn btn-outline-success filter-btn" data-category="Career">Career</button>
                    </div>
                </section>
            </div>
            <!-- find my match section -->
            <div class="col-12 col-md-6">
                <section class="find-match h-100">
                    <h2>Find My Match</h2>
                    <div class="form-group mb-3">
                        <label for="category-preference">Category Preference:</label>
                        <input type="text" id="category-preference" class="form-control" placeholder="Enter category preference">
                    </div>
                    <div class="form-group mb-3">
                        <label for="max-price">Maximum Price:</label>
                        <input type="number" id="max-price" class="form-control" placeholder="Enter maximum price">
                    </div>
                    <button id="find-match-btn" class="btn btn-success">Find My Match</button>
                </section>
            </div>
        </div>
    
        <section class="calculate-total">
            <h2>Cost Calculator</h2>
            <div class="form-group">
                <label for="hourly-rate">Hourly Rate ($):</label>
                <input type="number" id="hourly-rate" class="form-control" placeholder="Enter hourly rate">
            </div>
            <div class="form-group">
                <label for="hours">Hours:</label>
                <input type="number" id="hours" class="form-control" placeholder="Enter hours">
            </div>
            <button class="btn btn-primary" id="calculate-cost">Calculate Total</button>
            <p id="total-cost" class="mt-3"></p>
        </section>
    </main>
    <footer class="mt-auto py-3 text-center text-white bg-dark">
        <p class="mb-0">Skill Swap</p>
    </footer>
    <!-- Link to my JavaScript file -->
    <script src="skillswap-functions.js"></script>
    <script src="api-service.js"></script>
    <script src="script.js"></script>
</body>
</html>
